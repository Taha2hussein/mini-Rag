services:
  postgres:
    image: postgres:16
    container_name: mini-rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mini_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: